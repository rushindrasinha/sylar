    <circle r="26" fill="url(#glow)"/>
    <path d="M-150 0 H-96" stroke="#f5c542" stroke-width="3" stroke-linecap="round"/>
    <path d="M-110 -10 L-96 0 L-110 10" fill="none" stroke="#f5c542" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="72" y="150" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" fill="#f4f1ea" letter-spacing="-3">SYLAR</text>
  <text x="76" y="200" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#c9c3b8">Touch it. See how it works. It is yours.</text>
